<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador do Brasileirão 2027</title>
<style>
:root{color-scheme:dark;--bg:#0f0e0d;--paper:#151412;--ink:#f0efed;--soft:#a19f99;--line:#302e29;--button:#22211f;--stripe:#1b1a18;--brand:#2cd397;--input:#22211f;--lib:#80d780;--pre:#50bd9b;--sula:#88b6ff;--none:#a7a49e;--drop:#ff8e98}
html[data-tema=claro]{color-scheme:light;--bg:#f7f6f3;--paper:#fff;--ink:#242321;--soft:#686660;--line:#dcd9d2;--button:#eeece7;--stripe:#f5f4f0;--brand:#13835a;--input:#eeece7;--lib:#28803a;--pre:#145341;--sula:#215dc5;--none:#66736b;--drop:#bd303a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif} button,input,select{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}a{color:var(--brand)}
main{max-width:1240px;margin:auto;padding:14px 24px}h2{margin:0;font-size:19px}button,select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 11px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(315px,1fr);gap:24px;align-items:start}.panel{border:1px solid var(--line);background:var(--paper);border-radius:10px;overflow:hidden}.panel-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}.panel-head span{font-size:12px;color:var(--soft)}
.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{height:31px;text-align:center;border-bottom:1px solid var(--line);padding:0 5px}thead th{text-transform:uppercase;font-size:10px;color:var(--soft);letter-spacing:.05em}tbody td{font-size:13px}tbody th{text-align:left;font-weight:500;font-size:14px}td:nth-child(odd){background:var(--stripe)}td:nth-child(3){font-weight:750}.pos{color:var(--zone);border-left:3px solid var(--zone);width:36px;background:var(--paper)!important;font-weight:650}.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 12px;font-size:11px;color:var(--soft)}.legend span::before{content:'';background:var(--zone);width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.round-head{justify-content:center}.fixture{display:grid;grid-template-columns:minmax(0,1fr) 37px 16px 37px minmax(0,1fr);gap:6px;align-items:center;min-height:61px;border-bottom:1px solid var(--line);padding:7px 12px}.club{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px}.home{justify-content:flex-end}.club img{width:30px;height:31px;object-fit:contain}.versus{text-align:center;color:var(--soft)}input.goal{width:100%;height:34px;border:1px solid var(--line);border-radius:5px;background:var(--input);color:var(--ink);text-align:center;padding:2px;font-weight:650}
@media(max-width:850px){.grid{grid-template-columns:minmax(0,1fr);gap:14px}.matches{grid-row:1}main{padding:12px}.fixture{min-height:53px}}
@media(max-width:380px){.fixture{grid-template-columns:minmax(0,1fr) 32px 12px 32px minmax(0,1fr);gap:4px;padding-inline:6px}.club{gap:4px}.club img{width:25px}}
main{padding:10px 14px}.grid{gap:14px}.panel{border-radius:6px}.panel-head{padding:6px 10px}.fixture{min-height:46px;padding:4px 9px}.club img{width:26px;height:27px}input.goal{height:30px}th,td{height:26px}.legend{padding:8px 10px}
@media(max-width:850px){main{padding:8px}.grid{gap:8px}}
body{min-height:100vh;display:flex}main{width:100%;margin:auto}
.theme-bar{position:relative;display:flex;justify-content:flex-end;margin-bottom:8px}
#tema{display:grid;place-items:center;width:36px;height:36px;padding:0;background:var(--button);border-radius:100px}
#tema:hover{border-color:var(--soft)}
#tema svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* Keep the standings card as the height reference on desktop. */
@media(min-width:851px){
  .matches{align-self:stretch;display:flex;flex-direction:column}
  .matches form{display:flex;flex:1;flex-direction:column}
  .matches #fixtures{display:grid;flex:1}
  .matches #fixtures{grid-template-rows:repeat(10,minmax(52px,1fr))}
}
.matches .fixture:last-child{border-bottom:0}

:root{
  --glass-green:#2cd397;
  --glass-yellow:#f4cc58;
  --glass-edge:rgb(255 255 255 / .13);
  --glass-reflection:rgb(255 255 255 / .075);
  --glass-shadow:rgb(0 0 0 / .30);
}
html[data-tema=claro]{
  --glass-green:#38a873;
  --glass-yellow:#e6b43e;
  --glass-edge:rgb(40 64 51 / .17);
  --glass-reflection:rgb(255 255 255 / .55);
  --glass-shadow:rgb(36 54 43 / .12);
}
body{
  background:
    radial-gradient(ellipse at 22% 19%, color-mix(in srgb,var(--glass-green) 30%,transparent), transparent 60%),
    radial-gradient(ellipse at 85% 80%, color-mix(in srgb,var(--glass-yellow) 10%,transparent), transparent 47%),
    var(--bg);
}
.panel{
  background:linear-gradient(145deg,var(--glass-reflection),transparent 64%),
    color-mix(in srgb,var(--paper) 72%,transparent);
  border-color:var(--glass-edge);
  box-shadow:0 12px 36px var(--glass-shadow), inset 0 1px var(--glass-reflection);
  backdrop-filter:blur(18px);
}
.pos{background:transparent!important}
td:nth-child(odd):not(.pos){background:color-mix(in srgb,var(--stripe) 60%,transparent)}
.matches .round-head{
  background:linear-gradient(105deg,color-mix(in srgb,var(--glass-green) 12%,transparent),transparent 65%,
    color-mix(in srgb,var(--glass-yellow) 10%,transparent));
}
#tema{
  background:color-mix(in srgb,var(--button) 70%,transparent);
  border:1px solid var(--glass-edge);
}

input.goal{
  background:color-mix(in srgb,var(--input) 68%,transparent);
  border-color:var(--glass-edge);
}
#tema svg{color:var(--brand)}
html[data-tema=escuro] #tema svg{color:var(--glass-yellow)}
.standings-panel{--table-rule:rgb(255 255 255 / .12);--table-band:rgb(255 255 255 / .055)}
html[data-tema=claro] .standings-panel{--table-rule:rgb(27 28 24 / .16);--table-band:rgb(27 28 24 / .045)}
.standings-panel table{font-family:Arial,Helvetica,sans-serif}
.standings-panel .rank-col{width:42px}
.standings-panel .stat-col{width:8%}
.standings-panel th,.standings-panel td{height:29px;border-bottom:1px solid var(--table-rule)}
.standings-panel thead th{height:35px;font-size:11px;font-weight:400;letter-spacing:0;border-bottom-color:var(--glass-edge)}
.standings-panel #standings{text-align:left;padding-left:15px}
.standings-panel tbody th{font-size:15px;font-weight:400;padding-left:6px}
.standings-panel tbody td{font-size:13px}
.standings-panel tbody .pos{border-left:0;text-align:left;padding-left:15px;font-size:15px;font-weight:400}
.standings-panel td:nth-child(odd):not(.pos){background:var(--table-band)}
.standings-panel td:nth-child(3){font-weight:700}
@media(max-width:450px){
  .standings-panel .rank-col{width:31px}
  .standings-panel .stat-col{width:9%}
  .standings-panel tbody .pos,.standings-panel #standings{padding-left:8px}
  .standings-panel tbody th{font-size:13px}
}
.round-strip{
  position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;
  width:min(100%,240px);padding:4px;border:1px solid var(--glass-edge);border-radius:9px;
  background:linear-gradient(150deg,var(--glass-reflection),transparent 70%),
    color-mix(in srgb,var(--button) 58%,transparent);
  box-shadow:-6px 0 12px -5px var(--glass-shadow),6px 0 12px -5px var(--glass-shadow),inset 0 1px var(--glass-reflection);
  backdrop-filter:blur(14px);
}
.round-strip button{
  min-width:0;min-height:30px;padding:3px 6px;border:1px solid transparent;border-radius:5px;
  background:transparent;color:var(--soft);font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
}
.round-strip button:hover{background:var(--glass-reflection);color:var(--ink)}
.round-strip button[aria-current="true"]{
  border-color:color-mix(in srgb,var(--brand) 55%,transparent);
  background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand);
}

.legend{gap:6px 13px;color:var(--soft);font:12px/1.35 Arial,Helvetica,sans-serif}
.legend span{display:inline-flex;align-items:center;white-space:nowrap}
.legend span::before{width:8px;height:8px;margin-right:5px}
.legend-lib{--zone:#106f2d}
.legend-pre{--zone:#3dbc9e}
.legend-sula{--zone:#1770c6}
.legend-drop{--zone:#c00}
.club-cell{display:flex;align-items:center;gap:7px}
.club-cell img{width:17px;height:17px;object-fit:contain;flex:none}
.matches .fixture{min-height:52px;row-gap:2px;padding-block:3px;align-content:center}
.fixture-date{grid-column:1/-1;text-align:center;color:var(--soft);font-size:11px;line-height:1.15;font-variant-numeric:tabular-nums}
.score-actions{display:flex;align-items:center;justify-content:flex-end;gap:13px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);font:12px/1.35 Arial,Helvetica,sans-serif}
.score-actions svg{margin-right:auto;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;color:var(--soft)}
.score-actions button{padding:0;border:0;background:transparent;color:var(--soft);border-radius:2px}
.score-actions button:hover,.score-actions button:focus-visible{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
@font-face{font-family:Manrope;src:url(manrope-600.woff2) format("woff2");font-weight:600;font-display:swap}
.site-title{
  position:absolute;inset:0 44px 0 0;display:flex;align-items:center;margin:0;
  font:600 18px/1 "Manrope","Arial Rounded MT Bold",system-ui,sans-serif;
  letter-spacing:-.035em;white-space:nowrap;color:var(--soft);
}
#tema .theme-moon,html[data-tema=claro] #tema .theme-sun{display:none}
html[data-tema=claro] #tema .theme-moon{display:block}
.theme-bar{gap:8px}
.site-title{right:88px}
.profile-link{display:block;flex:none;width:36px;height:36px;border-radius:50%}
.profile-link img{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<main>
<div class="theme-bar"><h1 class="site-title">Brasileirão2027</h1><a class="profile-link" href="https://github.com/silonfilho" target="_blank" rel="noopener" aria-label="Silon Filho no GitHub (abre em nova aba)"><img src="silon-filho.png" alt="" width="36" height="36"></a><button type="button" id="tema" aria-label="Ativar modo claro" title="Ativar modo claro"><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"></path></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.7 4.2a9 9 0 1 1 0 15.6 9.4 9.4 0 0 0 0-15.6Z"/></svg></button></div>
<div class="grid">
<section class="panel standings-panel" aria-labelledby="standings">
  <div class="scroll" tabindex="0">
    <table aria-labelledby="standings">

      <thead><tr><th id="standings" colspan="2" scope="colgroup">Classificação</th><th scope="col" title="Pontos">P</th><th scope="col" title="Jogos">J</th><th scope="col" title="Vitórias">V</th><th scope="col" title="Saldo de gols">SG</th><th scope="col" title="Gols pró">GP</th></tr></thead>
      <tbody id="table"></tbody>
    </table>
  </div>
  <div class="legend" id="legend"></div>
</section>
<section class="panel matches" aria-label="Jogos da rodada"><div class="panel-head round-head"><nav class="round-strip" id="round" aria-label="Selecionar rodada"></nav></div><form id="scores"><div id="fixtures"></div><div class="score-actions">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg>
<button type="button" id="clear-round">Limpar rodada</button>
<button type="button" id="clear-all">Limpar tudo</button>
</div></form></section>
</div>
</main>

const $ = id => document.getElementById(id);
const state = {round:0, results:{}};
const isGoal = value => typeof value === 'string' && /^\d+$/.test(value);
const completeScore = pair => pair?.length === 2 && pair.every(isGoal);
const roundValues = (i = state.round) => state.results[i] ?? schedule[i].map(() => ['', '']);
const zones = [
  [4,'lib','Libertadores (1º ao 4º)'],
  [5,'pre','Pré-Libertadores (5º)'],
  [11,'sula','Sul-Americana (6º ao 11º)'],
  [16,'none','Sem vaga continental'],
  [20,'drop','Rebaixamento (17º ao 20º)']
];
const zone = position => zones.find(([end]) => position <= end);
$('legend').innerHTML = zones.filter(([,color]) => color !== 'none').map(([,color,label]) => '<span class="legend-'+color+'">'+label+'</span>').join('');
function standings() {
  const rows = clubs.map(([name],id) => ({id,name,p:0,j:0,v:0,e:0,d:0,gp:0n,gc:0n,sg:0n}));
  for (let i = 0; i < schedule.length; i++) {
    if (!state.results[i]) continue;
    schedule[i].forEach(([home,away],m) => {
      const score = state.results[i][m];
      if (!completeScore(score)) return;
      const [a,b] = score.map(BigInt);
      for (const [id, scored, conceded] of [[home,a,b],[away,b,a]]) {
        const row = rows[id];
        row.j++;
        row.gp += scored;
        row.gc += conceded;
        row.sg += scored - conceded;
        if (scored > conceded) { row.v++; row.p += 3; }
        else if (scored === conceded) { row.e++; row.p++; }
        else row.d++;
      }
    });
  }
  return rows.sort((a,b) => b.p-a.p || b.v-a.v || (a.sg===b.sg ? 0 : a.sg>b.sg ? -1 : 1) || (a.gp===b.gp ? 0 : a.gp>b.gp ? -1 : 1) || a.name.localeCompare(b.name,'pt-BR'));
}
function drawTable() {
  $('table').innerHTML = standings().map((r,k) => {
    const [,color,label] = zone(k+1);
    return '<tr><td class="pos" style="--zone:var(--'+color+')" title="'+label+'">'+(k+1)+'</td><th scope="row"><span class="club-cell"><img src="'+crests[r.id]+'" alt="" width="17" height="17">'+r.name+'</span></th>'+['p','j','v','sg','gp'].map(key=>'<td>'+r[key]+'</td>').join('')+'</tr>';
  }).join('');
}
// Datas fictícias em horário de Brasília. Os confrontos continuam na ordem da tabela.
const midweekRounds = new Set([6, 12, 19, 26, 33]);
const weekendCount = schedule.length - midweekRounds.size;
const weekdayNames = ['dom','seg','ter','qua','qui','sex','sáb'];
const weekendTimes = ['16:00','18:30','21:00','16:00','16:00','18:30','18:30','19:00','20:30','20:00'];
const midweekTimes = ['19:00','19:30','20:00','20:30','21:30','21:30','19:00','19:30','20:00','21:30'];
let weekendIndex = -1;
const dates = schedule.map((games, round) => {
  const midweek = midweekRounds.has(round+1);
  if (!midweek) weekendIndex++;
  const week = Math.round(weekendIndex * 44 / (weekendCount - 1));
  return games.map((_, match) => {
    let offset = midweek ? (match < 6 ? 4 : 5) : match < 3 ? 0 : match < 9 ? 1 : 2;
    let time = (midweek ? midweekTimes : weekendTimes)[match];
    if (round === 0) offset = Math.min(offset,1);
    if (round === schedule.length-1) { offset = 1; time = '16:00'; }
    const date = new Date(Date.UTC(2027,1,6+week*7+offset));
    const label = weekdayNames[date.getUTCDay()]+', '+date.getUTCDate()+'/'+String(date.getUTCMonth()+1).padStart(2,'0');
    return {datetime: date.toISOString().slice(0,10)+'T'+time+'-03:00', label: label+' · '+time};
  });
});
const fixtureOrder = dates.map(round =>
  round.map((_, index) => index).sort((a, b) => round[a].datetime.localeCompare(round[b].datetime))
);
function render() {
  const i=state.round;
  $('round').innerHTML = [i - 1, i, i + 1].map(round => {
    if (round < 0 || round >= schedule.length) return '<span aria-hidden="true"></span>';
    const label = (round + 1) + 'ª rodada';
    return '<button type="button" data-round="'+round+'" aria-label="'+label+'" title="'+label+'"'+
      (round === i ? ' aria-current="true"' : '')+'>'+(round + 1)+'</button>';
  }).join('');
  const values=roundValues();
  const clubMarkup=(id,home)=>{
    const [name,abbr]=clubs[id];
    const crest='<img src="'+crests[id]+'" alt="" width="30" height="31">';
    return '<span class="club '+(home?'home':'away')+'" aria-label="'+name+'" title="'+name+'">'+(home?abbr+crest:crest+abbr)+'</span>';
  };
  const field=(id,m,side)=>'<input class="goal" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" aria-label="Gols de '+clubs[id][0]+'" data-match="'+m+'" data-side="'+side+'" value="'+values[m][side]+'">';
  $('fixtures').innerHTML=fixtureOrder[i].map(m => {
    const [a,b]=schedule[i][m];
    const {datetime,label}=dates[i][m];
    return '<div class="fixture"><time class="fixture-date" datetime="'+datetime+'">'+label+'</time>'+clubMarkup(a,true)+field(a,m,0)+'<span class="versus" aria-hidden="true">×</span>'+field(b,m,1)+clubMarkup(b,false)+'</div>';
  }).join('');
  drawTable();
}
function navigate(i) { state.round=i; render(); }
$('round').onclick = event => {
  const button = event.target.closest('button[data-round]');
  if (!button) return;
  navigate(Number(button.dataset.round));
  $('round').querySelector('[aria-current="true"]').focus();
};
$('scores').oninput=e=>{
  const field=e.target;
  if (!field.matches('input.goal')) return;
  const values=roundValues();
  const {match,side}=field.dataset;
  if (field.value!=='' && !isGoal(field.value)) { field.value=values[match][side]; return; }
  values[match][side]=field.value;
  state.results[state.round]=values;
  drawTable();
};
$('scores').onkeydown = event => {
  const field = event.target;
  if (event.key !== 'Enter' || event.isComposing || !field.matches('input.goal[data-side="1"]')) return;
  event.preventDefault();
  if (event.repeat) return;

  const order = fixtureOrder[state.round];
  let nextMatch = order[order.indexOf(Number(field.dataset.match)) + 1];
  if (nextMatch === undefined) {
    if (state.round === schedule.length - 1) return;
    navigate(state.round + 1);
    nextMatch = fixtureOrder[state.round][0];
  }
  const nextField = $('fixtures').querySelector('input.goal[data-match="'+nextMatch+'"][data-side="0"]');
  nextField.focus();
  nextField.select();
};
$('scores').onsubmit=e=>e.preventDefault();
$('clear-round').onclick = () => {
  delete state.results[state.round];
  render();
};
$('clear-all').onclick = () => {
  if (!confirm('Limpar os placares de todas as rodadas?')) return;
  state.results = {};
  render();
};
function applyTheme(theme) {
  document.documentElement.dataset.tema = theme;
  const label = theme === 'escuro' ? 'Ativar modo claro' : 'Ativar modo escuro';
  $('tema').setAttribute('aria-label', label);
  $('tema').title = label;
}
const themeKey = 'tema-brasileirao';
let theme = 'escuro';
try { if (localStorage.getItem(themeKey) === 'claro') theme = 'claro'; } catch {}
applyTheme(theme);
$('tema').onclick = () => {
  theme = theme === 'escuro' ? 'claro' : 'escuro';
  applyTheme(theme);
  try { localStorage.setItem(themeKey, theme); } catch {}
};
render();
